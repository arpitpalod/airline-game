# Applies the sign-in email settings (supabase/auth) to the live Supabase project when they reach main
# (see tools/auth/apply.sh). Merging a pull request that changes them is the approval. Needs the repository secrets
# SUPABASE_ACCESS_TOKEN and SMTP_PASSWORD.
name: Auth settings

on:
  push:
    branches: [main]
    paths: ['supabase/auth/**', 'tools/auth/**', '.github/workflows/auth.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-settings
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: sh tools/auth/apply.sh
